name: Adriatic web forecast verification and deployment
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/update_forecast.py'
      - 'scripts/benchmark_first_frame.py'
      - 'scripts/benchmark_browser.mjs'
      - 'scripts/benchmark_loading.mjs'
      - 'scripts/update_text_forecasts.py'
      - 'scripts/update_radar.py'
      - 'scripts/generate_apple_icons.py'
      - 'scripts/test_radar.mjs'
      - '.github/workflows/adriatic-web.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: adriatic-pages
  cancel-in-progress: false
jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install --disable-pip-version-check pillow pytesseract beautifulsoup4
      - run: python scripts/update_forecast.py
      - run: python scripts/update_text_forecasts.py
      - run: python scripts/update_radar.py
      - name: Generate iPhone / iPad Home Screen PNG icons
        run: python scripts/generate_apple_icons.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
      - name: Measure cold first-image transfer (direct DHMZ versus optimized preview)
        continue-on-error: true
        run: python scripts/benchmark_first_frame.py
      - name: Benchmark actual first visible wind image in headless Chrome
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node scripts/benchmark_browser.mjs

      - name: Test radar display with delayed DHMZ metadata
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node scripts/test_radar.mjs
      - name: Compare loading before and after optimization
        continue-on-error: true
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node scripts/benchmark_loading.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' && always()
        with:
          name: loading-comparison
          path: benchmark-results/
          if-no-files-found: ignore
