name: Adriatic web forecast verification and deployment
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/update_forecast.py'
      - 'scripts/benchmark_first_frame.py'
      - 'scripts/benchmark_browser.mjs'
      - 'scripts/benchmark_loading.mjs'
      - 'scripts/update_text_forecasts.py'
      - 'scripts/update_radar.py'
      - 'scripts/generate_apple_icons.py'
      - 'scripts/test_radar.mjs'
      - 'scripts/verify_publish.py'
      - 'scripts/test_webkit.mjs'
      - '.github/workflows/adriatic-web.yml'
  schedule:
    # Avoid the start-of-hour peak when GitHub may drop scheduled runs.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: adriatic-pages
  cancel-in-progress: false
jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install --disable-pip-version-check pillow pytesseract beautifulsoup4
      - name: Refresh DHMZ wind, radar and marine text independently
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_forecast.py > /tmp/dhmz-wind.log 2>&1 & WIND=$!
          python scripts/update_text_forecasts.py > /tmp/dhmz-text.log 2>&1 & TEXT=$!
          python scripts/update_radar.py > /tmp/dhmz-radar.log 2>&1 & RADAR=$!
          FAIL=0
          wait "$WIND" || FAIL=1
          wait "$TEXT" || FAIL=1
          wait "$RADAR" || FAIL=1
          cat /tmp/dhmz-wind.log /tmp/dhmz-text.log /tmp/dhmz-radar.log
          exit "$FAIL"
      - name: Validate published data and report source health
        run: python scripts/verify_publish.py
      - name: Generate iPhone / iPad Home Screen PNG icons
        run: python scripts/generate_apple_icons.py
      - uses: actions/configure-pages@v5
      - name: Install Pages artifact readiness client
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-artifact-check" --ignore-scripts --no-audit --no-fund --no-save @actions/artifact@2.1.3
      - uses: actions/upload-pages-artifact@v3
        id: pages-upload
        with:
          path: web
      # Use the same artifact service as deploy-pages; REST visibility alone is insufficient.
      - name: Wait for this Pages artifact to become visible
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        timeout-minutes: 2
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-upload.outputs.artifact_id }}
        with:
          script: |
            const path = require('node:path');
            const { DefaultArtifactClient } = require(path.join(
              process.env.RUNNER_TEMP,
              'pages-artifact-check/node_modules/@actions/artifact'
            ));
            const expectedId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(expectedId || '')) {
              throw new Error('Upload did not return a valid Pages artifact ID.');
            }
            const client = new DefaultArtifactClient();
            const deadline = Date.now() + 60_000;
            let attempt = 0;
            while (true) {
              attempt++;
              const { artifacts } = await client.listArtifacts();
              const matches = artifacts.filter(artifact => artifact.name === 'github-pages');
              if (matches.length > 1) {
                throw new Error('Multiple github-pages artifacts found; refusing ambiguous deployment.');
              }
              if (matches.length === 1) {
                if (String(matches[0].id) !== expectedId) {
                  throw new Error('Pages artifact ID differs from this upload; refusing deployment.');
                }
                core.info('Pages artifact ' + expectedId + ' is visible after ' + attempt + ' check(s).');
                break;
              }
              const remaining = deadline - Date.now();
              if (remaining <= 0) {
                throw new Error('Pages artifact ' + expectedId + ' was not visible within 60 seconds.');
              }
              core.info('Pages artifact metadata not visible yet; checking again.');
              await new Promise(resolve => setTimeout(resolve, Math.min(2000, remaining)));
            }
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Measure cold first-image transfer (direct DHMZ versus optimized preview)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python scripts/benchmark_first_frame.py
      - name: Benchmark actual first visible wind image in headless Chrome
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node scripts/benchmark_browser.mjs

      - name: Test radar display with delayed DHMZ metadata
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node scripts/test_radar.mjs
      - name: WebKit mobile regression check
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps webkit
          node scripts/test_webkit.mjs
      - name: Compare loading before and after optimization
        continue-on-error: true
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node scripts/benchmark_loading.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' && always()
        with:
          name: loading-comparison
          path: benchmark-results/
          if-no-files-found: ignore
